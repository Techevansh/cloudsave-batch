name: v3-agent-ci

on:
  push:
    branches:
      - v3-agent-rewrite
    paths:
      - 'agent-v3/**'
      - '.github/workflows/v3-agent-ci.yml'
  pull_request:
    paths:
      - 'agent-v3/**'
      - '.github/workflows/v3-agent-ci.yml'

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore agent-v3/CloudSave.Agent.sln

      - name: Build
        run: dotnet build agent-v3/CloudSave.Agent.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test agent-v3/CloudSave.Agent.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish self-contained Windows build
        run: dotnet publish agent-v3/CloudSave.Agent/CloudSave.Agent.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/cloudsave-agent

      - uses: actions/upload-artifact@v4
        with:
          name: cloudsave-agent-win-x64
          path: artifacts/cloudsave-agent
